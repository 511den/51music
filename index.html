<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>51music</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body {
            background: linear-gradient(135deg, #0f0c20 0%, #15102a 50%, #060214 100%);
            color: #f3f4f6;
            min-height: 100vh;
            padding: 60px 20px;
            background-attachment: fixed;
        }
        .container { max-width: 900px; margin: 0 auto; position: relative; }
        
        header { text-align: center; margin-bottom: 50px; position: relative; }
        header h1 {
            font-size: 3.2rem; font-weight: 900; letter-spacing: -1px;
            background: linear-gradient(45deg, #ff5500, #ff8800);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }
        header p { color: #8b85a7; font-size: 1.1rem; }

        .profile-btn {
            position: absolute;
            top: -40px;
            right: 0;
            background: rgba(255, 85, 0, 0.15);
            color: #ff5500;
            padding: 8px 18px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 85, 0, 0.3);
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .profile-btn:hover {
            background: #ff5500;
            color: #fff;
            transform: scale(1.05);
        }

        .song-list { display: flex; flex-direction: column; gap: 20px; }
        .song-item {
            display: flex; align-items: center; gap: 25px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px; padding: 20px;
            cursor: pointer; transition: 0.3s; text-decoration: none; color: inherit;
        }
        .song-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
            border-color: #ff5500;
        }
        .song-item.exclusive {
            border-color: rgba(180, 124, 255, 0.3);
        }
        .song-item.exclusive:hover {
            border-color: #b47cff;
            box-shadow: 0 0 20px rgba(180, 124, 255, 0.1);
        }
        .song-cover {
            width: 80px; height: 80px; border-radius: 12px;
            object-fit: cover; background: #222;
        }
        .song-info { flex: 1; }
        .song-title { font-size: 1.4rem; font-weight: 700; }
        .song-genre { 
            font-size: 0.8rem; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }
        .song-genre.default { color: #ff5500; }
        .song-genre.exclusive { 
            color: #b47cff;
            background: rgba(180, 124, 255, 0.15);
            padding: 2px 10px;
            border-radius: 20px;
            display: inline-block;
            border: 1px solid rgba(180, 124, 255, 0.2);
        }
        
        .sc-badge {
            font-size: 0.7rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 20px;
            color: #a49ebd;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .sc-badge.hidden {
            opacity: 0.3;
            cursor: default;
        }

        .demo-badge {
            font-size: 0.6rem;
            background: linear-gradient(135deg, #b47cff, #7c3aed);
            color: #fff;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-left: 8px;
            display: inline-block;
            vertical-align: middle;
        }

        @media (max-width: 600px) {
            .profile-btn { position: relative; top: 0; margin-bottom: 20px; justify-content: center; }
            header { display: flex; flex-direction: column; align-items: center; }
            .song-item { flex-wrap: wrap; gap: 15px; }
            .song-cover { width: 60px; height: 60px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="https://soundcloud.com/denis-invalidov" target="_blank" class="profile-btn">
                51Invalidov SoundCloud
            </a>
            <h1>51music</h1>
            <p>музыка еееееее</p>
        </header>
        <div class="song-list" id="songList"></div>
    </div>

    <script src="player.js"></script>
    <script>
        // Данные песен
        const songsData = [
            { 
                "id": 1, 
                "title": "Ж И Р О Б А С", 
                "genre": "Сингл", 
                "genreType": "default", 
                "file": "жиробас (банкомат).MP3",
                "cover": "covers/1.png", 
                "sc_link": "https://soundcloud.com/denis-invalidov/zh-i-r-o-b-a-s?si=cf2a8b4c02884c308d79d3e9a16a605d&utm_source=clipboard&utm_medium=text&utm_campaign=social_sharing" 
            },
            { 
                "id": 2, 
                "title": "ЖИРНЫЙ ПИДОР", 
                "genre": "Сниппет / Сингл", 
                "genreType": "default", 
                "file": "жирный пидор.MP3",
                "cover": "covers/2.png", 
                "sc_link": "https://soundcloud.com/denis-invalidov/zh-i-r-n-y-j-p-i-d-o-r?si=38ba0b47cc164648934b96123752f881&utm_source=clipboard&utm_medium=text&utm_campaign=social_sharing" 
            },
            { 
                "id": 3, 
                "title": "ПУЗЫРИЩЕ", 
                "genre": "Сниппет / Сингл", 
                "genreType": "default", 
                "file": "пузырище.MP3",
                "cover": "covers/3.png", 
                "sc_link": "https://soundcloud.com/denis-invalidov/p-u-z-y-r-i-shh-e?si=77e834d8edfa4022b35542ef85cc9c28&utm_source=clipboard&utm_medium=text&utm_campaign=social_sharing" 
            },
            { 
                "id": 4, 
                "title": "Я СОВСЕМ ПУЗЫРЬ", 
                "genre": "Сниппет / Сингл", 
                "genreType": "default", 
                "file": "я совсем пузырь.MP3",
                "cover": "covers/4.png", 
                "sc_link": "https://soundcloud.com/denis-invalidov/ya-s-o-v-s-e-m-p-u-z-y-r?si=203f851666124ec483e5e9744c4dfc89&utm_source=clipboard&utm_medium=text&utm_campaign=social_sharing" 
            },
            { 
                "id": 5, 
                "title": "Я ЖИРНЫЙ", 
                "genre": "Эксклюзив", 
                "genreType": "exclusive", 
                "file": "я жирный.MP3",
                "cover": "covers/play.png", 
                "sc_link": "" 
            }
        ];

        function renderList() {
            const container = document.getElementById('songList');
            container.innerHTML = '';
            songsData.forEach(song => {
                const item = document.createElement('a');
                item.href = `songs.html?id=${song.id}`;
                item.className = 'song-item';
                
                if (song.genreType === 'exclusive') {
                    item.classList.add('exclusive');
                }
                
                const genreClass = song.genreType === 'exclusive' ? 'exclusive' : 'default';
                
                let demoBadge = '';
                if (song.genreType === 'exclusive') {
                    demoBadge = `<span class="demo-badge">★ Демо</span>`;
                }
                
                let scBadgeClass = 'sc-badge';
                let scBadgeText = '▶ Слушать на SC';
                if (song.genreType === 'exclusive' || !song.sc_link) {
                    scBadgeClass += ' hidden';
                    scBadgeText = '▶ Эксклюзив';
                }
                
                item.innerHTML = `
                    <img src="${song.cover}" alt="${song.title}" class="song-cover" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2280%22 height=%2280%22%3E%3Crect width=%2280%22 height=%2280%22 fill=%22%23333%22/%3E%3Ctext x=%2220%22 y=%2245%22 font-family=%22sans-serif%22 font-size=%2214%22 fill=%22%23fff%22%3E51%3C/text%3E%3C/svg%3E'">
                    <div class="song-info">
                        <div class="song-genre ${genreClass}">${song.genre}</div>
                        <div class="song-title">${song.title} ${demoBadge}</div>
                    </div>
                    <div class="${scBadgeClass}">${scBadgeText}</div>
                `;
                container.appendChild(item);
            });
        }
        renderList();

        // Восстановление плеера при загрузке
        window.addEventListener('load', function() {
            try {
                const saved = localStorage.getItem('globalPlayerState');
                if (saved) {
                    const data = JSON.parse(saved);
                    if (data.song && data.isPlaying) {
                        // Находим песню по id
                        const song = songsData.find(s => s.id === data.song.id);
                        if (song) {
                            const audio = new Audio();
                            audio.src = song.file;
                            audio.currentTime = data.currentTime || 0;
                            audio.volume = data.volume || 1;
                            audio.play().catch(() => {});
                            window.initGlobalPlayer(song, audio);
                        }
                    }
                }
            } catch(e) {}
        });
    </script>
</body>
</html>
