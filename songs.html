            "lyrics_cover": "Следим за весом плохо\nИ мы знаем это\nЯ съедаю бургер\nобжираюсь знатно\nНо я голоден, бигхита не хватает вовсе \nЯ проебываю деньги, выпиваю колу всю\nНо, выпив досуха ее,я ощущаю жажду\nберу картошку фри, после съедаю сразу\nНо в них калорий не нашёл\nЗабираю комбо\nПревращаю в порошок\nПоглощаю разом\n\nИ вдруг я понимаю\nЧто жратвы не осталось\nА эти жажда и голод\nНавсегда со мной\nИ я каждый день снова\nПо бигхиту съедаю\nДиета не помогает\nЯ совсем пузырь\n\nВокруг бургеркинг\nПолный разных бигмаков\nВсевозможных комбо\nИ вкуснейших крыльев\nОтражающих складки,\nПроникающих в недра\nподкожного жира\nИ сгорающих в нём\n\nИ ТУТ Я ПОНИМАЮ\nЧТО БАБЛА НЕ ОСТАЛОСЬ\nА ЭТА ТЯГА К ФАСТФУДУ\nНАВСЕГДА СО МНОЙ\nИ Я КАЖДЫЙ ДЕНЬ СНОВА\nВ НИЩЕТЕ ПОМИРАЮ\nМАМКА УЖЕ НЕ ПОМОЖЕТ \nЯ СОВСЕМ НИЩИЙ\n\nВОКРУГ ЦЕЛЫЙ МАК\nПОЛНЫЙ ВКУСНЫХ БИГХИТОВ\nВСЕВОЗМОЖНЫХ ПРЕМЬЕРОВ\nНО ИХ БОЛЬШОЙ ЦЕННИК\nОТРАЖАЮЩИХ БЕДНОСТЬ,\nПРОНИКАЮЩИЙ В НЕДРА ПУСТОГО КОШЕЛЬКА\nИ РАСТВОРЯЮЩИХ ЖИР\n\nздесь нету текста мы аутист",
            "lyrics_original": "Мы танцуем плохо,\nИ мы знаем это.\nЯ целую лоб твой,\nОбнимаю крепко.\nНо я голоден, объятий не хватает вовсе,\nЯ вскрываю твои вены, выпиваю кровь всю.\nНо, выпив досуха тебя, я ощущаю жажду.\nРежу тебя на куски, после съедаю каждый,\nНо в них тебя я не нашёл.\nРасщепляю кости,\nПревращаю в порошок,\nЗапускаю в ноздри.\n\nИ вдруг я понимаю,\nЧто тебя не осталось,\nА эти жажда и голод\nНавсегда со мной.\nИ я каждый день снова\nО тебе вспоминаю,\nНо тебя не существует,\nЯ совсем один.\nВокруг целый мир,\nПолный галлюцинаций,\nВсевозможных зверей,\nИх прекрасных красных глаз,\nОтражающих небо;\nПроникающих в недра\nРаскалённого солнца,\nИ сгорающих в нём."

          {
